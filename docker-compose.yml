version: "3.8"

services:
  claude-usage-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-usage-api
    ports:
      - "8383:8383"
    volumes:
      # Volume persistant pour les données ccusage
      - ./data:/data/claude
      # Volume pour accéder aux logs Claude Code depuis la machine hôte
      # Linux : ~/.claude ou ~/.config/Claude
      # macOS : ~/Library/Application Support/Claude
      # Windows : %APPDATA%/Claude
      - ${CLAUDE_CONFIG_DIR:-~/.claude}:/root/.claude:ro
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8383/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
